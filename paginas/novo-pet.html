<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Hotel Pet - Novo Pet</title>
</head>
<body>
    <header>
        <h1>Hotel Pet</h1>
        <nav>
            <a href="reservas.html">Reservas</a> |
            <a href="pets.html">Pets</a> |
            <a href="usuarios.html">Usuários</a> |
            <a href="configuracoes.html">Configurações</a>
        </nav>
    </header>
    <main>
        <h2>Cadastrar Novo Pet</h2>

        <form>
            <label for="nome">Nome:</label><br>
            <input type="text" id="nome" name="nome"><br><br>

            <label for="tipo">Tipo de animal:</label><br>
            <select id="tipo" name="tipo">
                <option>Cachorro</option>
                <option>Gato</option>
                <option>Outro</option>
            </select><br><br>

            <label for="raca">Raça:</label><br>
            <input type="text" id="raca" name="raca"><br><br>

            <label for="tamanho">Tamanho:</label><br>
            <select id="tamanho" name="tamanho">
                <option>Pequeno</option>
                <option>Médio</option>
                <option>Grande</option>
            </select><br><br>

            <label for="proprietario">Proprietário:</label><br>
            <select id="proprietario" name="proprietario">
                <option>Geovane Oliveria</option>
                <option>Maria das Graças</option>
            </select><br><br>

            <label for="foto">Foto:</label><br>
            <input type="file" id="foto" name="foto"><br><br>

            <button type="submit">Salvar</button>
            <button type="reset">Limpar</button>
        </form>

        <p><a href="pets.html">Voltar para Pets</a></p>
    </main>

</body>
</html>
