
<!DOCTYPE html>

    <!-- Informações do animal -->

        <p><strong>Nome:</strong> <span id="nome"></span></p>

        <p><strong>Tipo:</strong> <span id="tipo"></span></p>

        <p><strong>Raça:</strong> <span id="raca"></span></p>

        <p><strong>Tamanho:</strong> <span id="tamanho"></span></p>

                <th>Período</th>

        <tbody>
            <tr>
                <td>01/07/2026 a 05/07/2026</td>
                <td>Finalizada</td>

            </tr>
