<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Hotel Pet - Fazer Reserva</title>
</head>
<body>

    <h1>Hotel Pet</h1>

    <p>
        <a href="reservas.html">Reservas</a> |
        <a href="pets.html">Pets</a> |
        <a href="usuarios.html">Usuários</a> |
        <a href="configuracoes.html">Configurações</a>
    </p>

    <h2>Fazer Reserva</h2>

    <form>
        <label for="pet">Pet:</label><br>
        <select id="pet" name="pet">
            <option>Berg</option>
            <option>Lara</option>
            <option>Lion</option>
        </select><br><br>

        <label for="inicio">Data de início:</label><br>
        <input type="date" id="inicio" name="inicio"><br><br>

        <label for="fim">Data de término:</label><br>
        <input type="date" id="fim" name="fim"><br><br>

        <label for="informacoes">Informações sobre o Pet:</label><br>
        <textarea id="informacoes" name="informacoes" rows="5" cols="40"></textarea><br><br>

        <p><strong>Total das diárias: R$ 100,00</strong></p>

        <input type="submit" value="Salvar">
        <input type="reset" value="Limpar">
    </form>

    <p><a href="reservas.html">Voltar para Reservas</a></p>

</body>
</html>
