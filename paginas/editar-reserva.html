
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Hotel Pet - Editar Reserva</title>
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>

    <h1>Hotel Pet</h1>

    <p class="menu">
        <a href="reservas.html">Reservas</a> |
        <a href="pets.html">Pets</a> |
        <a href="usuarios.html">Usuários</a> |
        <a href="configuracoes.html">Configurações</a> |
        <a href="editar-perfil.html">Meu Perfil</a> |
        <a href="../index.html">Sair</a>
    </p>

    <h2>Editar Reserva</h2>

    <form id="form-editar-reserva">

        <label for="id-reserva">ID da Reserva:</label><br>
        <input type="text" id="id-reserva" readonly><br><br>

        <label for="pet">Pet:</label><br>
        <select id="pet" required>
            <option value="">Selecione um pet</option>
        </select><br><br>

        <label for="inicio">Data de início:</label><br>
        <input type="date" id="inicio" required><br><br>

        <label for="fim">Data de término:</label><br>
        <input type="date" id="fim" required><br><br>

        <label for="informacoes">Informações sobre o Pet:</label><br>
        <textarea id="informacoes" rows="5" cols="40"></textarea><br><br>

        <label for="status">Status:</label><br>
        <select id="status" required>
            <option value="Agendada">Agendada</option>
            <option value="Confirmada">Confirmada</option>
            <option value="Em andamento">Em andamento</option>
            <option value="Concluída">Concluída</option>
            <option value="Cancelada">Cancelada</option>
        </select><br><br>

        <input type="submit" value="Salvar Alterações">
        <input type="reset" value="Limpar">

    </form>

    <p class="menu">
        <a href="reservas.html">Voltar para Reservas</a>
    </p>

    <script src="../arquivo.js/navegacao.js"></script>
    <script src="../arquivo.js/dados.js"></script>

</body>
</html>
