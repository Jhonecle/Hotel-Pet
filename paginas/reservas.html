
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Hotel Pet - Reservas</title>
    <link rel="stylesheet" href="../CSS/style.css">
</head>
<body>

    <h1>Hotel Pet</h1>

    <p class="menu">
        <a href="reservas.html" data-navegar>Reservas</a> |
        <a href="pets.html" data-navegar>Pets</a> |
        <a href="usuarios.html" data-navegar>Usuários</a> |
        <a href="configuracoes.html" data-navegar>Configurações</a> |
        <a href="editar-perfil.html" data-navegar>Meu Perfil</a> |
        <a href="../index.html">Sair</a>
    </p>

    <h2 id="titulo-pagina">Reservas</h2>

    <p class="menu">
        <a href="fazer-reserva.html">Nova Reserva</a>
    </p>

    <h3>Pesquisar Reserva</h3>

    <!-- Formulário de pesquisa -->
    <form id="form-busca-reservas">
        <label for="pesquisa-reservas">
            ID, pet, proprietário ou status:
        </label>

        <input
            type="text"
            id="pesquisa-reservas"
            name="pesquisa"
            placeholder="Digite sua pesquisa"
        >

        <input type="submit" value="Pesquisar">
        <input type="reset" value="Limpar">
    </form>

    <!-- Mensagem dos resultados -->
    <p id="mensagem-reservas" aria-live="polite"></p>

    <h3>Reservas cadastradas</h3>

    <table id="tabela-reservas" border="1">
        <thead>
            <tr>
                <th>ID</th>
                <th>Pet</th>
                <th>Proprietário</th>
                <th>Período</th>
                <th>Status</th>
                <th>Ações</th>
            </tr>
        </thead>

        <tbody>
            
        </tbody>
    </table>

    <script src="../arquivo.js/navegacao.js"></script>
    <script src="../arquivo.js/dados.js"></script>
    <script src="../arquivo.js/buscas.js"></script>

</body>
</html>
