<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Hotel Pet - Editar Usuário</title>
</head>
<body>

    <h1>Hotel Pet</h1>

    <p>
        <a href="reservas.html">Reservas</a> |
        <a href="pets.html">Pets</a> |
        <a href="usuarios.html">Usuários</a> |
        <a href="configuracoes.html">Configurações</a>
    </p>

    <h2>Editar Usuário</h2>

    <form>
        <label for="nome">Nome:</label><br>
        <input type="text" id="nome" name="nome" value="João da Silva"><br><br>

        <label for="email">E-mail:</label><br>
        <input type="text" id="email" name="email" value="joao@email.com"><br><br>

        <label for="telefone">Telefone:</label><br>
        <input type="text" id="telefone" name="telefone" value="(77) 99999-9999"><br><br>

        <label for="funcao">Função:</label><br>
        <select id="funcao" name="funcao">
            <option>Cliente</option>
            <option>Funcionário</option>
            <option>Gerente</option>
        </select><br><br>

        <label for="status">Status:</label><br>
        <select id="status" name="status">
            <option>Ativo</option>
            <option>Inativo</option>
        </select><br><br>

        <input type="submit" value="Salvar">
        <input type="reset" value="Limpar">
    </form>

    <p><a href="usuarios.html">Voltar</a></p>

</body>
</html>
