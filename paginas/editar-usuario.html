
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Hotel Pet - Editar Usuário</title>
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>

    <h1>Hotel Pet</h1>

    <p class="menu">
        <a href="reservas.html" data-navegar>Reservas</a> |
        <a href="pets.html" data-navegar>Pets</a> |
        <a href="usuarios.html" data-navegar>Usuários</a> |
        <a href="configuracoes.html">Configurações</a>
    </p>

    <h2>Editar Usuário</h2>

    <form id="form-editar-usuario">

        <label for="nome">Nome:</label><br>
        <input type="text" id="nome" name="nome" required><br><br>

        <label for="email">E-mail:</label><br>
        <input type="email" id="email" name="email" required><br><br>

        <label for="telefone">Telefone:</label><br>
        <input type="text" id="telefone" name="telefone" required><br><br>

        <label for="funcao">Função:</label><br>
        <select id="funcao" name="funcao" required>
            <option value="Cliente">Cliente</option>
            <option value="Funcionário">Funcionário</option>
            <option value="Gerente">Gerente</option>
        </select><br><br>

        <label for="status">Status:</label><br>
        <select id="status" name="status" required>
            <option value="Ativo">Ativo</option>
            <option value="Inativo">Inativo</option>
        </select><br><br>

        <input type="submit" value="Salvar Alterações">
        <input type="reset" value="Limpar">

    </form>

    <p class="menu">
        <a href="usuarios.html">Voltar</a>
    </p>

    <script src="../arquivo.js/navegacao.js"></script>
    <script src="../arquivo.js/dados.js"></script>

</body>
</html>
